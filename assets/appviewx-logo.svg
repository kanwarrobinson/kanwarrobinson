<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="appviewxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8e53;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Circular Background -->
  <circle cx="100" cy="100" r="95" fill="url(#appviewxGradient)" filter="url(#shadow)"/>
  
  <!-- Company Logo Shape - A and V combined -->
  <g fill="white">
    <!-- A shape -->
    <path d="M 60 140 L 70 80 L 80 140 M 70 110 L 78 110" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- V shape -->
    <path d="M 105 80 L 120 140 M 135 80 L 120 140" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="150" cy="90" r="3" fill="white" opacity="0.7"/>
  <circle cx="160" cy="110" r="2" fill="white" opacity="0.5"/>
  <circle cx="155" cy="135" r="2" fill="white" opacity="0.5"/>
</svg>
